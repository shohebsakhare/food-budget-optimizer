version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food_budget_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://foodbudget:foodbudget_secret@db:5432/food_budget_db
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: food_budget_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=foodbudget
      - POSTGRES_PASSWORD=foodbudget_secret
      - POSTGRES_DB=food_budget_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql

volumes:
  pgdata:
